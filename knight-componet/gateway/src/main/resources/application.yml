spring:
  application:
    name: gateway
  session:
    domain: legao.crec
    expire: 1800          # 30分钟（单位：秒）
    app-expire: 2592000   # 30天（单位：秒）
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 认证服务路由
            - id: auth-service
              uri: lb://AUTH-SERVICE
              # 断言，断言为真，则路由匹配
              predicates:
                - Path=/api/auth/**
              # 过滤器
              filters:
                - StripPrefix=1
                - AddResponseHeader=X-Response-Default-Foo, Default-Bar

            # 其他服务路由
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

server:
  port: 8080
  servlet:
    context-path: /crec-api

#网关路由配置
#为zuul设置一个公共的前缀

